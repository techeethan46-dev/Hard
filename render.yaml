# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Render will ask you for every value marked `sync: false`.
services:
  - type: web
    name: roblox-community-bot
    runtime: node
    # The free plan sleeps after 15 minutes without web traffic, which takes the bot offline.
    # Starter is the cheapest plan that stays on 24/7.
    plan: starter
    buildCommand: npm ci --omit=dev
    # Registers slash commands on every deploy, then starts the bot.
    startCommand: npm run deploy && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ROBLOX_PLACE_ID
        sync: false
      - key: ROBLOX_GROUP_ID
        sync: false
      - key: VERIFIED_ROLE_ID
        sync: false
      - key: UNVERIFIED_ROLE_ID
        sync: false
      - key: WELCOME_CHANNEL_ID
        sync: false
      - key: MOD_LOG_CHANNEL_ID
        sync: false
      - key: SUGGESTIONS_CHANNEL_ID
        sync: false
      - key: TICKET_CATEGORY_ID
        sync: false
      - key: TICKET_LOG_CHANNEL_ID
        sync: false
      - key: SUPPORT_ROLE_IDS
        sync: false
      - key: ROBLOX_OAUTH_CLIENT_ID
        sync: false
      - key: ROBLOX_OAUTH_CLIENT_SECRET
        sync: false
